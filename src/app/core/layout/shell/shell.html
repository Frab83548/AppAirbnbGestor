<mat-sidenav-container class="shell-container">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (closedStart)="sidenavOpened.set(false)"
    class="shell-sidenav"
  >
    <div class="brand">
      <mat-icon>account_balance</mat-icon>
      <span>App Finanzas</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          (click)="onNavClick()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      <button
        mat-icon-button
        (click)="toggleSidenav()"
        aria-label="Mostrar u ocultar menú de navegación"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">{{ currentTitle() }}</span>
      <span class="toolbar-spacer"></span>
      <app-period-selector />
      <button
        mat-icon-button
        (click)="toggleTheme()"
        [matTooltip]="theme.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        [attr.aria-label]="theme.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
