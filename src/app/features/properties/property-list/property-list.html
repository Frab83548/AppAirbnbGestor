<app-page-header title="Propiedades" subtitle="Administrá tu portafolio de alquileres temporarios">
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Nueva propiedad
  </button>
</app-page-header>

@if (loading()) {
  <app-loading-state />
} @else if (properties().length === 0) {
  <app-empty-state
    icon="apartment"
    title="Sin propiedades"
    message="Agregá tu primera propiedad para comenzar."
  >
    <button mat-flat-button color="primary" (click)="openCreate()">Agregar propiedad</button>
  </app-empty-state>
} @else {
  <div class="table-card">
    <table mat-table [dataSource]="properties()" class="responsive-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let p" data-label="Nombre"><strong>{{ p.name }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let p" data-label="Dirección">{{ p.address }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p" data-label="Estado">
          <mat-chip>{{ statusLabel(p.status) }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="registeredAt">
        <th mat-header-cell *matHeaderCellDef>Fecha alta</th>
        <td mat-cell *matCellDef="let p" data-label="Fecha alta">{{ p.registeredAt | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Acciones</span></th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button [attr.aria-label]="'Editar ' + p.name" (click)="openEdit(p)">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            [attr.aria-label]="'Eliminar ' + p.name"
            (click)="deleteProperty(p)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
}
