<app-page-header title="Gastos Variables" subtitle="Costos operativos por propiedad">
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Nuevo gasto
  </button>
</app-page-header>

@if (loading()) {
  <app-loading-state />
} @else if (expenses().length === 0) {
  <app-empty-state icon="receipt_long" title="Sin gastos variables" message="No hay gastos en este período.">
    <button mat-flat-button color="primary" (click)="openCreate()">Registrar gasto</button>
  </app-empty-state>
} @else {
  <div class="table-card">
    <table mat-table [dataSource]="expenses()" class="responsive-table">
      <ng-container matColumnDef="expenseDate">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let e" data-label="Fecha">{{ e.expenseDate | date: 'dd/MM/yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="property">
        <th mat-header-cell *matHeaderCellDef>Propiedad</th>
        <td mat-cell *matCellDef="let e" data-label="Propiedad">{{ e.propertyName }}</td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let e" data-label="Categoría">{{ categoryLabel(e.category) }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let e" data-label="Descripción">{{ e.description }}</td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let e" data-label="Monto">{{ e.amount | currencyArs }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Acciones</span></th>
        <td mat-cell *matCellDef="let e">
          <button mat-icon-button aria-label="Editar gasto" (click)="openEdit(e)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" aria-label="Eliminar gasto" (click)="deleteExpense(e)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
}
