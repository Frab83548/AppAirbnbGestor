<div class="kpi-card" [class]="'accent-' + accent()">
  <div class="kpi-header">
    <mat-icon>{{ icon() }}</mat-icon>
    <span class="kpi-title">{{ title() }}</span>
  </div>
  <div class="kpi-value">
    @if (format() === 'currency') {
      {{ value() | currencyArs }}
    } @else if (format() === 'percent') {
      {{ value() | percent }}
    } @else {
      {{ value() }}
    }
  </div>
  @if (subtitle()) {
    <p class="kpi-subtitle">{{ subtitle() }}</p>
  }
</div>
